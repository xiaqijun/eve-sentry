[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-sentry-esi-gateway"
version = "1.0.0"
description = "Private allow-listed public EVE ESI gateway"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff==0.15.14"]
storage = ["psycopg[binary,pool]>=3.2,<4", "redis>=5,<6"]

[tool.setuptools]
packages = ["esi_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = ["build"]
