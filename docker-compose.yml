services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_risk
      POSTGRES_USER: eve_risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_risk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_risk -d eve_risk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eve_risk:${POSTGRES_PASSWORD:-eve_risk}@postgres:5432/eve_risk
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sde-sync:
    build: .
    command: ["python", "-m", "eve_risk.sde"]
    env_file: .env
    environment:
      SDE_INDEX_PATH: /data/sde.sqlite3
    volumes:
      - sde_data:/data
    restart: "no"

  bot:
    build: .
    command: ["python", "-m", "eve_risk.bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eve_risk:${POSTGRES_PASSWORD:-eve_risk}@postgres:5432/eve_risk
      REDIS_URL: redis://redis:6379/0
      SDE_INDEX_PATH: /data/sde.sqlite3
    volumes:
      - sde_data:/data:ro
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sde-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "eve_risk.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eve_risk:${POSTGRES_PASSWORD:-eve_risk}@postgres:5432/eve_risk
      REDIS_URL: redis://redis:6379/0
      SDE_INDEX_PATH: /data/sde.sqlite3
    volumes:
      - sde_data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sde-sync:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  sde_data:
