name: Client CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "main.py"
      - "packaging/**"
      - "resources/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "conftest.py"
      - ".github/workflows/ci-client.yml"
      - ".github/workflows/release-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "main.py"
      - "packaging/**"
      - "resources/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "conftest.py"
      - ".github/workflows/ci-client.yml"
      - ".github/workflows/release-client.yml"
  workflow_dispatch:

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EVE_SENTRY_OCR_BACKEND: onnx
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - name: Install client test dependencies
        run: python -m pip install -r requirements-onnx.txt pytest
      - name: Run client tests
        # This legacy integration module imports app.server, which is not owned here.
        run: python -m pytest -q --ignore=tests/test_intel_client.py
