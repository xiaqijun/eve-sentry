[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eve-risk-analysis"
version = "0.1.0"
description = "EVE Online Tranquility hostile fleet analysis QQ bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anyio>=4.4,<5",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "qq-botpy>=1.2,<2",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.24,<3",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
eve-risk-bot = "eve_risk.bot:main"
eve-risk-health = "eve_risk.health:main"
eve-risk-configure-qq-panel = "eve_risk.qq_panel:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eve_risk"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
