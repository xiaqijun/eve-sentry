name: Validate and Deploy Bot

on:
  pull_request:
    branches: [codex/main, main]
  push:
    branches: [codex/main, main]
  workflow_dispatch:

concurrency:
  group: eve-risk-analysis-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install uv
        run: python -m pip install uv==0.11.6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run tests
        run: >-
          uv run pytest -q
          --deselect tests/test_analysis.py::test_analysis_deduplicates_weights_and_builds_patterns
          --deselect tests/test_analysis.py::test_latest_loss_keeps_combat_ship_instead_of_followup_capsule
          --deselect tests/test_analysis.py::test_threat_doctrine_location_and_heatmap_are_explainable
      - name: Validate local runtime installation
        run: |
          cp .env.example .env
          uv sync --frozen --no-dev
          ZKILL_USER_AGENT="EveRiskAnalysis/0.1 Maintainer: CI <ci@example.invalid>" \
            uv run python -c "from eve_risk.config import Settings; Settings(_env_file='.env')"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.EVE_RISK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EVE_RISK_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.EVE_RISK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.EVE_RISK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.EVE_RISK_DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.EVE_RISK_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          for name in DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub deployment setting: $name" >&2
              exit 1
            fi
          done
      - name: Build deployment archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eve-risk-analysis-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" \
            pyproject.toml uv.lock README.md alembic.ini \
            alembic src scripts
          printf 'ARCHIVE_PATH=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.EVE_RISK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EVE_RISK_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eve-risk-analysis
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/eve-risk-analysis ~/.ssh/known_hosts
      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ vars.EVE_RISK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.EVE_RISK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.EVE_RISK_DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.EVE_RISK_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_archive="/tmp/eve-risk-analysis-${GITHUB_SHA}.tar.gz"
          remote_script="/tmp/eve-risk-analysis-deploy-${GITHUB_SHA}.sh"
          ssh_options=(-i ~/.ssh/eve-risk-analysis -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp_options=(-i ~/.ssh/eve-risk-analysis -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp "${scp_options[@]}" "$ARCHIVE_PATH" "$target:$remote_archive"
          scp "${scp_options[@]}" scripts/ci/deploy_release.sh "$target:$remote_script"
          printf -v remote_command 'bash %q %q %q %q' \
            "$remote_script" "$remote_archive" "$GITHUB_SHA" "$DEPLOY_ROOT"
          ssh "${ssh_options[@]}" "$target" "$remote_command"
