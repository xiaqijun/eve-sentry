name: Deploy Download Site

on:
  push:
    branches: [main]
    paths:
      - "download-site/**"
      - "deploy/cloudflare-download/**"
      - "docs/client.md"
      - "docs/server-deployment.md"
      - ".github/workflows/deploy-download-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "download-site/**"
      - "deploy/cloudflare-download/**"
      - "docs/client.md"
      - "docs/server-deployment.md"
      - ".github/workflows/deploy-download-site.yml"
  workflow_dispatch:

concurrency:
  group: eve-sentry-download-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOWNLOAD_SITE_URL: https://evesentrydownload.kisectool.com
      WRANGLER_VERSION: 4.116.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: download-site/package-lock.json
      - name: Install dependencies
        working-directory: download-site
        run: npm ci
      - name: Build static site
        working-directory: download-site
        run: npm run build
      - name: Validate static export
        shell: bash
        run: |
          test -s download-site/out/index.html
          test -s download-site/out/docs/client.html
          test -s download-site/out/docs/server.html
      - name: Test download Worker
        run: node --test deploy/cloudflare-download/src/index.test.js
      - name: Validate Worker bundle
        run: >-
          npx --yes wrangler@${WRANGLER_VERSION} deploy
          --dry-run
          --config deploy/cloudflare-download/wrangler.jsonc
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@${WRANGLER_VERSION} deploy
          --config deploy/cloudflare-download/wrangler.jsonc
      - name: Verify production site
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base_url="${DOWNLOAD_SITE_URL%/}"

          for path in / /docs/client /docs/server; do
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
              "${base_url}${path}" > /dev/null
          done

          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            "${base_url}/" | grep -q "SENTRYORBIT"

          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            "${base_url}/health" > health.json
          node -e \
            "const p=require('./health.json');if(p.ok!==true||p.service!=='eve-sentry-download')process.exit(1)"

          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            "${base_url}/latest.json" > latest.json
          node -e \
            "const p=require('./latest.json');if(!/^\\d+\\.\\d+\\.\\d+/.test(p.version)||!/^EVE-Sentry-Monitor-ONNX-.*\\.zip$/.test(p.filename)||!(p.size>0)||!/^[0-9a-f]{64}$/i.test(p.sha256))process.exit(1)"

          curl -sS -D redirect.headers -o /dev/null \
            "${base_url}/download/latest"
          redirect_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${base_url}/download/latest")"
          test "$redirect_status" = "302"
          grep -Eiq "^location: ${base_url}/download/EVE-Sentry-Monitor-ONNX-.*\\.zip" \
            redirect.headers

          range_status="$(curl -fsS -L --range 0-1023 --max-filesize 2048 \
            -D range.headers -o /dev/null -w '%{http_code}' \
            "${base_url}/download/latest")"
          test "$range_status" = "206"
          grep -Eiq "^content-range: bytes 0-1023/[1-9][0-9]*" range.headers
