name: Deploy Download Site

on:
  workflow_dispatch:
    inputs:
      download_site_sha:
        description: Exact eve-sentry-download-site commit to deploy
        required: true
        default: 102d027a183cc4ec90e149d0ff972a5c6ebeeec0
        type: string

concurrency:
  group: eve-sentry-download-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/download-site-production-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DOWNLOAD_SITE_URL: https://evesentrydownload.kisectool.com
      DOWNLOAD_SITE_REPOSITORY: xiaqijun/eve-sentry-download-site
      WRANGLER_VERSION: 4.116.0
    steps:
      - name: Check out immutable standalone download site
        uses: actions/checkout@v5
        with:
          repository: xiaqijun/eve-sentry-download-site
          ref: ${{ inputs.download_site_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: download-site/package-lock.json

      - name: Validate standalone source and client Release
        run: |
          set -euo pipefail
          expected_sha="${{ inputs.download_site_sha }}"
          test "$expected_sha" = "102d027a183cc4ec90e149d0ff972a5c6ebeeec0"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          git remote get-url origin | grep -Eq 'github\.com[/:]xiaqijun/eve-sentry-download-site(\.git)?$'
          test ! -e app
          test ! -e frontend
          grep -Eq '"GITHUB_REPO"[[:space:]]*:[[:space:]]*"eve-sentry-client"' \
            deploy/cloudflare-download/wrangler.jsonc
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/xiaqijun/eve-sentry-client/releases/latest/download/latest.json \
            > client-latest.json
          node -e \
            "const p=require('./client-latest.json');if(p.version!=='1.0.53'||p.signing_key_id!=='eve-sentry-release-v1'||!p.signature)process.exit(1)"

      - name: Install dependencies
        working-directory: download-site
        run: npm ci

      - name: Build static site
        working-directory: download-site
        run: npm run build

      - name: Validate static export
        run: |
          test -s download-site/out/index.html
          test -s download-site/out/docs/client.html
          test -s download-site/out/docs/server.html

      - name: Test download Worker
        run: node --test deploy/cloudflare-download/src/index.test.js

      - name: Validate Worker bundle
        run: >-
          npx --yes wrangler@${WRANGLER_VERSION} deploy
          --dry-run
          --config deploy/cloudflare-download/wrangler.jsonc

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Cloudflare deployment secret: $name" >&2
              exit 1
            fi
          done

      - name: Deploy standalone site to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@${WRANGLER_VERSION} deploy
          --config deploy/cloudflare-download/wrangler.jsonc

      - name: Verify production
        run: bash .github/scripts/verify-production.sh
