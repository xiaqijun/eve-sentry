name: ESI Gateway CI/CD

on:
  push:
    branches: [main]
    paths:
      - "esi-gateway/**"
      - ".github/workflows/deploy-esi-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "esi-gateway/**"
      - ".github/workflows/deploy-esi-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: esi-gateway
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: esi-gateway/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test,storage]'
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run static checks
        run: python -m ruff check . && python -m compileall -q esi_gateway scripts
      - name: Run test suite
        run: python -m pytest
      - name: Validate deployment scripts
        if: matrix.python-version == '3.13'
        run: |
          bash -n deploy/ci/build_esi_gateway_archive.sh
          bash -n deploy/ci/deploy_esi_gateway.sh
          shellcheck deploy/ci/*.sh

  package:
    name: Build verified deployment artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: esi-gateway
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build deterministic archive
        run: bash deploy/ci/build_esi_gateway_archive.sh "$GITHUB_SHA" dist
      - name: Verify archive checksum and contents
        run: |
          cd dist
          sha256sum --check "eve-sentry-esi-gateway-${GITHUB_SHA}.tar.gz.sha256"
          tar -tzf "eve-sentry-esi-gateway-${GITHUB_SHA}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: eve-sentry-esi-gateway-${{ github.sha }}
          path: |
            esi-gateway/dist/eve-sentry-esi-gateway-${{ github.sha }}.tar.gz
            esi-gateway/dist/eve-sentry-esi-gateway-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: esi-gateway
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: eve-sentry-esi-gateway-${{ github.sha }}
          path: esi-gateway/dist
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.EVE_SENTRY_ESI_GATEWAY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EVE_SENTRY_ESI_GATEWAY_KNOWN_HOSTS }}
          CONFIGURED_GATEWAY_ROOT: ${{ vars.EVE_SENTRY_ESI_GATEWAY_ROOT }}
          CONFIGURED_SERVICE_NAME: ${{ vars.EVE_SENTRY_ESI_GATEWAY_SERVICE_NAME }}
          CONFIGURED_HEALTH_URL: ${{ vars.EVE_SENTRY_ESI_GATEWAY_HEALTH_URL }}
          CONFIGURED_KEEP_RELEASES: ${{ vars.EVE_SENTRY_ESI_GATEWAY_KEEP_RELEASES }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_DEPLOY_HOST is missing or invalid"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_DEPLOY_USER is missing or invalid"; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_DEPLOY_PORT must be numeric"; exit 1; }
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo "::error::EVE_SENTRY_ESI_GATEWAY_DEPLOY_PORT must be between 1 and 65535"; exit 1; }
          [[ -n "$DEPLOY_KEY" ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_SSH_KEY is not configured"; exit 1; }
          [[ -n "$KNOWN_HOSTS" ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_KNOWN_HOSTS is not configured"; exit 1; }

          gateway_root="${CONFIGURED_GATEWAY_ROOT:-/opt/eve-sentry-esi-gateway}"
          service_name="${CONFIGURED_SERVICE_NAME:-eve-sentry-esi-gateway}"
          health_url="${CONFIGURED_HEALTH_URL:-http://10.233.53.17:8787/health}"
          keep_releases="${CONFIGURED_KEEP_RELEASES:-5}"
          [[ "$gateway_root" =~ ^/[A-Za-z0-9._/-]+$ && "$gateway_root" != "/" && "$gateway_root" != *".."* ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_ROOT is invalid"; exit 1; }
          [[ "$service_name" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_SERVICE_NAME is invalid"; exit 1; }
          [[ "$health_url" =~ ^https?://[^[:space:]]+$ ]] || { echo "::error::EVE_SENTRY_ESI_GATEWAY_HEALTH_URL is invalid"; exit 1; }
          if [[ ! "$keep_releases" =~ ^[0-9]+$ ]] || (( keep_releases < 2 || keep_releases > 20 )); then
            echo "::error::EVE_SENTRY_ESI_GATEWAY_KEEP_RELEASES must be between 2 and 20"
            exit 1
          fi

          {
            echo "GATEWAY_ROOT=$gateway_root"
            echo "SERVICE_NAME=$service_name"
            echo "HEALTH_URL=$health_url"
            echo "KEEP_RELEASES=$keep_releases"
          } >> "$GITHUB_ENV"
      - name: Verify downloaded artifact
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "eve-sentry-esi-gateway-${GITHUB_SHA}.tar.gz.sha256"
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.EVE_SENTRY_ESI_GATEWAY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EVE_SENTRY_ESI_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eve-sentry-esi-gateway
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/eve-sentry-esi-gateway ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/eve-sentry-esi-gateway >/dev/null
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
      - name: Upload and deploy atomically
        env:
          DEPLOY_HOST: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.EVE_SENTRY_ESI_GATEWAY_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          local_archive="dist/eve-sentry-esi-gateway-${GITHUB_SHA}.tar.gz"
          remote_archive="/tmp/eve-sentry-esi-gateway-${GITHUB_SHA}.tar.gz"
          remote_script="/tmp/eve-sentry-esi-gateway-deploy-${GITHUB_SHA}.sh"
          expected_sha256="$(sha256sum "$local_archive" | awk '{print $1}')"
          ssh_options=(-i ~/.ssh/eve-sentry-esi-gateway -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          scp_options=(-i ~/.ssh/eve-sentry-esi-gateway -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          scp "${scp_options[@]}" "$local_archive" "$target:$remote_archive"
          scp "${scp_options[@]}" deploy/ci/deploy_esi_gateway.sh "$target:$remote_script"
          printf -v remote_command 'bash %q %q %q %q %q %q %q %q' \
            "$remote_script" "$remote_archive" "$GITHUB_SHA" "$expected_sha256" \
            "$GATEWAY_ROOT" "$SERVICE_NAME" "$HEALTH_URL" "$KEEP_RELEASES"
          ssh "${ssh_options[@]}" "$target" "$remote_command" | tee deployment-result.log
          {
            echo "### Production deployment"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Health endpoint: \`$HEALTH_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local SSH material
        if: always()
        run: rm -f ~/.ssh/eve-sentry-esi-gateway ~/.ssh/known_hosts
