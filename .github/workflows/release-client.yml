name: Release Client

on:
  push:
    branches: [main]
    paths:
      - app/version.py
  workflow_dispatch:

concurrency:
  group: eve-sentry-client-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-onnx.txt
            requirements-server.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-onnx.txt -r requirements-server.txt pyinstaller pytest pytest-rerunfailures
      - name: Run tests
        run: python -m pytest -q --reruns 1 --reruns-delay 1
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Restore bundled OCR models
        run: .\scripts\restore_release_models.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and publish client
        run: >-
          .\scripts\publish_client_release.ps1
          -Python "python"
          -DownloadBaseUrl "https://evesentrydownload.kisectool.com/download"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify release manifest and download range
        shell: pwsh
        run: |
          $version = (python -c "from app.version import APP_VERSION; print(APP_VERSION)").Trim()
          $manifestUrl = "https://evesentrydownload.kisectool.com/latest.json?run=$env:GITHUB_RUN_ID"
          $manifest = Invoke-RestMethod -Uri $manifestUrl -TimeoutSec 30
          if ($manifest.version -ne $version) {
              throw "Manifest version $($manifest.version) does not match $version"
          }
          $headers = curl.exe -fsS -D - -o NUL -H "Range: bytes=0-1023" $manifest.url
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch "206 Partial Content") {
              throw "Cloudflare range download verification failed."
          }
          gh release view "v$version" --json url,assets,targetCommitish
        env:
          GH_TOKEN: ${{ github.token }}
