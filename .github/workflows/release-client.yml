name: Release Client

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/version.py"
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in app/version.py (optional safety check)
        required: false
        type: string

concurrency:
  group: client-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    environment: client-release
    env:
      EVE_SENTRY_OCR_BACKEND: onnx
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_REPOSITORY: xiaqijun/eve-sentry
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = (python -c "from app.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid app version: $version"
          }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) {
              throw "Requested version $env:REQUESTED_VERSION does not match app version $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $expectedTag = "v$version"
              if ($env:GITHUB_REF_NAME -ne $expectedTag) {
                  throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
              }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify release credentials and destination
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EVE_SENTRY_RELEASE_TOKEN }}
          EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw "EVE_SENTRY_RELEASE_TOKEN is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64)) {
              throw "EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 is required"
          }
          gh repo view $env:RELEASE_REPOSITORY --json nameWithOwner | Out-Null
          $tag = "v${{ steps.version.outputs.version }}"
          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag --repo $env:RELEASE_REPOSITORY --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorAction
          if ($releaseExists) {
              throw "Release $env:RELEASE_REPOSITORY@$tag already exists; refusing to overwrite it"
          }
      - name: Install client build dependencies
        run: python -m pip install -r requirements-onnx.txt pyinstaller pytest
      - name: Run client tests
        # This legacy integration module imports app.server, which is not owned here.
        run: python -m pytest -q --ignore=tests/test_intel_client.py
      - name: Restore bundled OCR models from the release repository
        run: >-
          .\scripts\restore_release_models.ps1
          -Repository "xiaqijun/eve-sentry"
        env:
          GH_TOKEN: ${{ secrets.EVE_SENTRY_RELEASE_TOKEN }}
      - name: Build, sign, and publish client assets
        run: >-
          .\scripts\publish_client_release.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Python "python"
          -Repository "xiaqijun/eve-sentry"
          -ReleaseTarget "main"
          -DownloadBaseUrl "https://evesentrydownload.kisectool.com/download"
        env:
          GH_TOKEN: ${{ secrets.EVE_SENTRY_RELEASE_TOKEN }}
          EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
