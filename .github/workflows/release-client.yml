name: Release Client

on:
  workflow_run:
    workflows: ["Client CI"]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in app/version.py (optional safety check)
        required: false
        type: string

concurrency:
  group: client-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name != 'workflow_run' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.lookup.outputs.should_release }}
      version: ${{ steps.lookup.outputs.version }}
      release_sha: ${{ steps.lookup.outputs.release_sha }}
      run_tests: ${{ steps.lookup.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve release version
        id: lookup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_TESTS: ${{ github.event_name != 'workflow_run' }}
        run: |
          if ($env:RELEASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Release target must be a full commit SHA: $env:RELEASE_SHA"
          }
          $version = (python -c "from app.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid app version: $version"
          }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) {
              throw "Requested version $env:REQUESTED_VERSION does not match app version $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
          }
          $ErrorActionPreference = "SilentlyContinue"
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($exists) {
              Write-Host "Release v$version already exists; treating this run as a successful no-op."
              "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
              "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_sha=$($env:RELEASE_SHA.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_tests=$($env:RUN_TESTS.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    environment: client-release
    permissions:
      contents: write
    env:
      EVE_SENTRY_OCR_BACKEND: onnx
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_REPOSITORY: xiaqijun/eve-sentry-client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - name: Verify release credentials and destination
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw "github.token is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64)) {
              throw "EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 is required"
          }
          gh repo view $env:RELEASE_REPOSITORY --json nameWithOwner | Out-Null
      - name: Install client build dependencies
        run: python -m pip install -r requirements-onnx.txt pyinstaller
      - name: Install client test dependency
        if: needs.check-release.outputs.run_tests == 'true'
        run: python -m pip install pytest
      - name: Run client tests
        if: needs.check-release.outputs.run_tests == 'true'
        # This legacy integration module imports app.server, which is not owned here.
        run: python -m pytest -q --ignore=tests/test_intel_client.py
      - name: Restore bundled OCR models from the release repository
        run: >-
          .\scripts\restore_release_models.ps1
          -Repository "xiaqijun/eve-sentry-client"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build, sign, and publish client assets
        run: >-
          .\scripts\publish_client_release.ps1
          -Version "${{ needs.check-release.outputs.version }}"
          -Python "python"
          -Repository "xiaqijun/eve-sentry-client"
          -ReleaseTarget "${{ needs.check-release.outputs.release_sha }}"
          -DownloadBaseUrl "https://evesentrydownload.kisectool.com/download"
        env:
          GH_TOKEN: ${{ github.token }}
          EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.EVE_SENTRY_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
