name: Validate Client

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "main.py"
      - "packaging/**"
      - "scripts/publish_client_release.ps1"
      - "scripts/restore_release_models.ps1"
      - "scripts/update_signing.py"
      - "requirements*.txt"
      - "resources/**"
      - "tests/**"
      - ".github/workflows/ci-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "main.py"
      - "packaging/**"
      - "scripts/publish_client_release.ps1"
      - "scripts/restore_release_models.ps1"
      - "scripts/update_signing.py"
      - "requirements*.txt"
      - "resources/**"
      - "tests/**"
      - ".github/workflows/ci-client.yml"
  workflow_dispatch:

concurrency:
  group: eve-sentry-client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-onnx.txt
            requirements-server.txt
      - name: Install client test dependencies
        run: python -m pip install -r requirements-onnx.txt -r requirements-server.txt pytest pytest-rerunfailures
      - name: Run client tests
        run: python -m pytest -q --reruns 1 --reruns-delay 1
        env:
          QT_QPA_PLATFORM: offscreen
