name: Client CI

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"
      - ".github/workflows/release-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"
      - ".github/workflows/release-client.yml"
  workflow_dispatch:

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    env:
      EVE_SENTRY_OCR_BACKEND: onnx
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: client/requirements-onnx.txt
      - name: Install client test dependencies
        run: python -m pip install -r requirements-onnx.txt pytest
      - name: Verify removed game-log disconnect detector stays absent
        shell: pwsh
        run: |
          $patterns = @('GameConnectionLogWatcher', '_poll_game_connection_logs', 'game_connection_')
          $files = @('app', '..\app') |
            Where-Object { Test-Path -LiteralPath $_ } |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -Include *.py }
          foreach ($pattern in $patterns) {
            $matches = $files | Select-String -SimpleMatch -Pattern $pattern
            if ($matches) {
              Write-Error "Forbidden removed game-log symbol found: $pattern`n$matches"
              exit 1
            }
          }
      - name: Run client unit tests
        run: python -m pytest -q --ignore=tests/test_intel_client.py
      - name: Run client-server integration tests
        run: python -m pytest -q tests/test_intel_client.py
